$kind: http-example
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "0235c6cb-5268-3fc1-be61-76c9e7b479d6",
        "email": "ana@test.com"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "email": {
            "type": "string",
            "example": "ana@test.com",
            "format": "email"
          }
        }
      }
order: 1000
