$kind: http-request
description: ""
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "ana@test.com",
      "password": "SuperSecreta"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "example": "ana@test.com",
          "format": "email"
        },
        "password": {
          "type": "string",
          "minLength": 8,
          "maxLength": 72,
          "example": "SuperSecreta"
        }
      },
      "required": [
        "email",
        "password"
      ]
    }
settings: {}
examples: ./.resources/Iniciar sesión y obtener un token.resources/examples
order: 1000
